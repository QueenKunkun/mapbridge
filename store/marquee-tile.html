<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MapBridge — Marquee Promo Tile (1400×560)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .tile {
    width: 1400px;
    height: 560px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .tile::before {
    content: '';
    position: absolute;
    top: -160px;
    right: -160px;
    width: 520px;
    height: 520px;
    background: radial-gradient(circle, rgba(37,99,235,0.25) 0%, transparent 70%);
    border-radius: 50%;
  }
  .tile::after {
    content: '';
    position: absolute;
    bottom: -200px;
    left: -120px;
    width: 480px;
    height: 480px;
    background: radial-gradient(circle, rgba(16,185,129,0.15) 0%, transparent 70%);
    border-radius: 50%;
  }
  .logo {
    width: 180px;
    height: 180px;
    flex-shrink: 0;
    filter: drop-shadow(0 0 24px rgba(37,99,235,0.5));
  }
  .text {
    color: #fff;
    position: relative;
    z-index: 1;
  }
  .text h1 {
    font-size: 64px;
    font-weight: 700;
    letter-spacing: -1px;
  }
  .text p {
    font-size: 28px;
    color: #94a3b8;
    margin-top: 14px;
    max-width: 560px;
    line-height: 1.4;
  }
  .badges {
    position: absolute;
    bottom: 40px;
    left: 0;
    right: 0;
    text-align: center;
    color: #475569;
    font-size: 18px;
    letter-spacing: 2px;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="tile">
    <img class="logo" src="../public/icon/mapbridge.svg" alt="MapBridge">
    <div class="text">
      <h1>MapBridge</h1>
      <p>百度 ↔ 高德，收藏夹一键迁移</p>
    </div>
    <div class="badges">本地完成 · 无需服务器 · 不收集数据</div>
  </div>
</body>
</html>
